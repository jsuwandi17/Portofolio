<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Jaenudin Suwandi Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/admin.css">

  <style>
    body.admin-body { background-color: #0f172a !important; color: #0f172a !important; }
    .admin-card { background-color: #ffffff !important; color: #0f172a !important; border: 1px solid #cbd5e1 !important; }
    .admin-card-title, .admin-card label, .item-editor-card label, .item-editor-card h4 { color: #0f172a !important; font-weight: 700 !important; }
    .form-control, input.form-control, textarea.form-control {
      background-color: #f8fafc !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      padding: 0.75rem 1rem !important;
      border-radius: 8px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
  </style>
</head>

<body class="admin-body">

  <div class="auth-overlay" id="authOverlay" style="display: flex;">
    <div class="auth-card">
      <h2 class="auth-title">Admin Management Portal</h2>
      <form id="authForm" onsubmit="directLogin(event)">
        <div style="text-align: left; margin-bottom: 1.25rem;">
          <label class="form-label">Username</label>
          <input type="text" id="adminUser" class="form-control" placeholder="admin" required autofocus>
        </div>
        <div style="text-align: left; margin-bottom: 1.5rem;">
          <label class="form-label">Password</label>
          <input type="password" id="adminPass" class="form-control" placeholder="••••••••" required>
          <div id="authError" style="color: #ef4444; font-size: 0.8rem; margin-top: 0.4rem;"></div>
        </div>
        <button type="submit" class="btn-admin btn-admin-primary" style="width: 100%; justify-content: center;">Unlock Dashboard</button>
      </form>
    </div>
  </div>

  <aside class="admin-sidebar">
    <div class="admin-brand">
      <div style="width: 36px; height: 36px; background: #0284c7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; border-radius: 8px;">JS</div>
      <div>
        <div style="font-weight: 700; color: #fff;">Admin Portal</div>
        <div style="font-size: 0.72rem; color: #94a3b8;">Jaenudin Suwandi</div>
      </div>
    </div>

    <nav class="admin-nav-list">
      <button type="button" class="admin-tab-btn active" onclick="switchTab('profile', this)"><span>Profile & Bio</span></button>
      <button type="button" class="admin-tab-btn" onclick="switchTab('projects', this)"><span>Case Studies</span></button>
      <button type="button" class="admin-tab-btn" onclick="switchTab('experience', this)"><span>Work History</span></button>
      <button type="button" class="admin-tab-btn" onclick="switchTab('skills', this)"><span>Skills & Stack</span></button>
      <button type="button" class="admin-tab-btn" onclick="switchTab('achievements', this)"><span>Achievements</span></button>
      <button type="button" class="admin-tab-btn" onclick="switchTab('settings', this)"><span>Site Settings</span></button>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../index.html" target="_blank" class="btn-admin btn-admin-secondary" style="justify-content: center;">View Live Site ↗</a>
      <button type="button" class="btn-admin btn-admin-danger" onclick="directLogout()" style="justify-content: center;">Log Out</button>
    </div>
  </aside>

  <main class="admin-content">
    <div class="admin-header-row">
      <div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #f8fafc;">Content Management</h1>
      </div>
      <div class="admin-actions-bar">
        <button type="button" class="btn-admin btn-admin-success" onclick="saveAllChanges()">Save Changes</button>
        <button type="button" class="btn-admin btn-admin-primary" onclick="exportJSON()">Download JSON</button>
      </div>
    </div>

    <!-- TAB 1: Profile -->
    <div class="admin-tab-section" id="profileSection" style="display: block;">
      <div class="admin-card">
        <h2 class="admin-card-title">Profile Identity</h2>
        <div class="form-grid-3" style="margin-bottom: 1rem;">
          <div><label>Full Name</label><input type="text" id="profileName" class="form-control"></div>
          <div><label>Primary Role</label><input type="text" id="profileRolePrimary" class="form-control"></div>
          <div><label>Secondary Role</label><input type="text" id="profileRoleSecondary" class="form-control"></div>
        </div>
        <div class="form-grid-3" style="margin-bottom: 1rem;">
          <div><label>Email</label><input type="email" id="profileEmail" class="form-control"></div>
          <div><label>Phone</label><input type="text" id="profilePhone" class="form-control"></div>
          <div><label>Location</label><input type="text" id="profileLocation" class="form-control"></div>
        </div>
        <div style="margin-bottom: 1rem;"><label>Hero Headline</label><input type="text" id="profileHeadline" class="form-control"></div>
        <div style="margin-bottom: 1rem;"><label>Hero Bio</label><textarea id="profileBio" class="form-control" rows="3"></textarea></div>
      </div>
    </div>

    <!-- TAB 2: Projects -->
    <div class="admin-tab-section" id="projectsSection" style="display: none;">
      <div class="admin-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2 class="admin-card-title">Case Studies & Projects</h2>
          <button type="button" class="btn-admin btn-admin-primary" onclick="addProject()">+ Add Project</button>
        </div>
        <div id="projectsContainer"></div>
      </div>
    </div>

    <!-- TAB 3: Experience -->
    <div class="admin-tab-section" id="experienceSection" style="display: none;">
      <div class="admin-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2 class="admin-card-title">Work Experience</h2>
          <button type="button" class="btn-admin btn-admin-primary" onclick="addExperience()">+ Add Experience</button>
        </div>
        <div id="experienceContainer"></div>
      </div>
    </div>

    <!-- TAB 4: Skills -->
    <div class="admin-tab-section" id="skillsSection" style="display: none;">
      <div class="admin-card">
        <h2 class="admin-card-title">Skills & Stack</h2>
        <div id="opsSkillsContainer"></div>
        <div id="techSkillsContainer" style="margin-top: 1.5rem;"></div>
      </div>
    </div>

    <!-- TAB 5: Achievements -->
    <div class="admin-tab-section" id="achievementsSection" style="display: none;">
      <div class="admin-card"><div id="achievementsContainer"></div></div>
    </div>

    <!-- TAB 6: Settings -->
    <div class="admin-tab-section" id="settingsSection" style="display: none;">
      <div class="admin-card">
        <label>Custom Logo URL</label><input type="text" id="settingLogoUrl" class="form-control" style="margin-bottom: 1rem;">
        <label>Custom BG URL</label><input type="text" id="settingBackgroundUrl" class="form-control">
      </div>
    </div>
  </main>

  <script>
    let currentData = null;

    function checkDirectAuth() {
      const isAuth = sessionStorage.getItem('admin_logged_in') === 'true';
      document.getElementById('authOverlay').style.display = isAuth ? 'none' : 'flex';
      if (isAuth) fetchAndPopulate();
    }

    function directLogin(e) {
      if (e) e.preventDefault();
      if (document.getElementById('adminUser').value.trim() === 'admin' && document.getElementById('adminPass').value === 'admin123') {
        sessionStorage.setItem('admin_logged_in', 'true');
        checkDirectAuth();
      } else {
        document.getElementById('authError').textContent = 'Username/Password salah (admin / admin123)';
      }
    }

    function directLogout() {
      sessionStorage.removeItem('admin_logged_in');
      checkDirectAuth();
    }

    function switchTab(tabName, element) {
      document.querySelectorAll('.admin-tab-section').forEach(sec => sec.style.display = 'none');
      document.querySelectorAll('.admin-nav-list .admin-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabName + 'Section').style.display = 'block';
      if (element) element.classList.add('active');
    }

    async function fetchAndPopulate() {
      const paths = ['../data/content.json', '/data/content.json', 'data/content.json'];
      for (let path of paths) {
        try {
          const res = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
          if (res.ok) {
            currentData = await res.json();
            break;
          }
        } catch (e) {}
      }

      if (!currentData) {
        const cached = localStorage.getItem('portfolio_content');
        if (cached) currentData = JSON.parse(cached);
      }

      if (currentData) {
        localStorage.setItem('portfolio_content', JSON.stringify(currentData));
        renderAll();
      }
    }

    function renderAll() {
      if (!currentData) return;
      const p = currentData.profile || {};
      if (document.getElementById('profileName')) document.getElementById('profileName').value = p.name || '';
      if (document.getElementById('profileRolePrimary')) document.getElementById('profileRolePrimary').value = p.rolePrimary || '';
      if (document.getElementById('profileRoleSecondary')) document.getElementById('profileRoleSecondary').value = p.roleSecondary || '';
      if (document.getElementById('profileEmail')) document.getElementById('profileEmail').value = p.email || '';
      if (document.getElementById('profilePhone')) document.getElementById('profilePhone').value = p.phone || '';
      if (document.getElementById('profileLocation')) document.getElementById('profileLocation').value = p.location || '';
      if (document.getElementById('profileHeadline')) document.getElementById('profileHeadline').value = p.heroHeadline || '';
      if (document.getElementById('profileBio')) document.getElementById('profileBio').value = p.heroBio || '';

      const expContainer = document.getElementById('experienceContainer');
      if (expContainer && currentData.experience) {
        expContainer.innerHTML = '';
        currentData.experience.forEach((exp, idx) => {
          expContainer.innerHTML += `
            <div style="background:#fff; border:1px solid #cbd5e1; padding:1.25rem; border-radius:8px; margin-bottom:1rem;">
              <div style="display:flex; justify-content:space-between; margin-bottom:0.75rem;">
                <h4 style="margin:0; font-size:1.1rem; color:#0f172a;">${exp.role} @ ${exp.company}</h4>
                <button type="button" class="btn-admin btn-admin-danger" onclick="deleteExperience(${idx})">Delete</button>
              </div>
              <div class="form-grid-3" style="margin-bottom:0.75rem;">
                <input type="text" class="form-control" value="${exp.role || ''}" onchange="currentData.experience[${idx}].role=this.value">
                <input type="text" class="form-control" value="${exp.company || ''}" onchange="currentData.experience[${idx}].company=this.value">
                <input type="text" class="form-control" value="${exp.period || ''}" onchange="currentData.experience[${idx}].period=this.value">
              </div>
              <textarea class="form-control" rows="3" onchange="currentData.experience[${idx}].bulletPoints=this.value.split('\\n')">${(exp.bulletPoints || []).join('\n')}</textarea>
            </div>`;
        });
      }

      const projContainer = document.getElementById('projectsContainer');
      if (projContainer && currentData.projects) {
        projContainer.innerHTML = '';
        currentData.projects.forEach((proj, idx) => {
          projContainer.innerHTML += `
            <div style="background:#fff; border:1px solid #cbd5e1; padding:1.25rem; border-radius:8px; margin-bottom:1rem;">
              <div style="display:flex; justify-content:space-between; margin-bottom:0.75rem;">
                <h4 style="margin:0; font-size:1.1rem; color:#0f172a;">Project #${idx + 1}: ${proj.title}</h4>
                <button type="button" class="btn-admin btn-admin-danger" onclick="deleteProject(${idx})">Delete</button>
              </div>
              <input type="text" class="form-control" value="${proj.title || ''}" onchange="currentData.projects[${idx}].title=this.value" style="margin-bottom:0.5rem;">
              <textarea class="form-control" rows="2" onchange="currentData.projects[${idx}].summary=this.value">${proj.summary || ''}</textarea>
            </div>`;
        });
      }
    }

    function addExperience() {
      if (!currentData.experience) currentData.experience = [];
      currentData.experience.unshift({ role: 'Position', company: 'Company', period: '2026', bulletPoints: ['Achievement'] });
      renderAll();
    }

    function deleteExperience(idx) {
      currentData.experience.splice(idx, 1);
      renderAll();
    }

    function addProject() {
      if (!currentData.projects) currentData.projects = [];
      currentData.projects.push({ title: 'New Project', summary: 'Summary' });
      renderAll();
    }

    function deleteProject(idx) {
      currentData.projects.splice(idx, 1);
      renderAll();
    }

    async function saveAllChanges() {
      localStorage.setItem('portfolio_content', JSON.stringify(currentData));
      try {
        await fetch('/api/save-content', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentData) });
        alert('Perubahan tersimpan!');
      } catch (e) {
        alert('Tersimpan lokal di browser!');
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = "content.json";
      a.click();
    }

    document.addEventListener('DOMContentLoaded', checkDirectAuth);
  </script>
</body>
</html>
