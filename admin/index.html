<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Jaenudin Suwandi Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">

  <style>
    /* Styling khusus input form biar terang & tulisannya kelihatan jelas */
    .admin-card input.form-control,
    .admin-card textarea.form-control,
    .item-editor-card input.form-control,
    .item-editor-card textarea.form-control {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
    }
    .admin-card label.form-label,
    .admin-card label,
    .item-editor-card label {
      color: #1e293b !important;
      font-weight: 600 !important;
    }
  </style>
</head>

<body class="admin-body">

  <!-- Modal Auth Login -->
  <div class="auth-overlay" id="authOverlay" style="display: flex;">
    <div class="auth-card">
      <div class="auth-lock-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h2 class="auth-title">Admin Management Portal</h2>
      <p class="auth-desc">Please log in to manage your portfolio data.</p>

      <form id="authForm" onsubmit="directLogin(event)">
        <div style="text-align: left; margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Username</label>
          <input type="text" id="adminUser" class="form-control" placeholder="admin" required autofocus>
        </div>

        <div style="text-align: left; margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
          <input type="password" id="adminPass" class="form-control" placeholder="••••••••" required>
          <div id="authError" style="color: #ef4444; font-size: 0.8rem; margin-top: 0.4rem;"></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span>Unlock Dashboard</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Sidebar Navigasi Admin -->
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <div class="logo-monogram" style="width: 32px; height: 32px; font-size: 0.85rem;">JS</div>
      <div>
        <div style="font-weight: 700; font-size: 1rem;">Admin Portal</div>
        <div style="font-size: 0.72rem; color: #94a3b8;">Jaenudin Suwandi</div>
      </div>
    </div>

    <nav class="admin-nav-list">
      <button type="button" class="admin-tab-btn active" data-tab="profile">
        <span>Profile & Bio</span>
      </button>
      <button type="button" class="admin-tab-btn" data-tab="projects">
        <span>Case Studies</span>
      </button>
      <button type="button" class="admin-tab-btn" data-tab="experience">
        <span>Work History</span>
      </button>
      <button type="button" class="admin-tab-btn" data-tab="skills">
        <span>Skills & Stack</span>
      </button>
      <button type="button" class="admin-tab-btn" data-tab="achievements">
        <span>Achievements</span>
      </button>
      <button type="button" class="admin-tab-btn" data-tab="settings">
        <span>Site Settings</span>
      </button>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../index.html" target="_blank" class="btn-admin btn-admin-secondary" style="text-align: center; justify-content: center;">
        <span>View Live Site ↗</span>
      </a>
      <button type="button" class="btn-admin btn-admin-danger" onclick="directLogout()" style="text-align: center; justify-content: center;">
        <span>Log Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Work Area -->
  <main class="admin-content">

    <div class="admin-header-row">
      <div>
        <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 0.25rem;">Content Management</h1>
        <p style="color: var(--admin-text-muted); font-size: 0.92rem;">Edit content across all pages of your portfolio.</p>
      </div>

      <div class="admin-actions-bar">
        <button type="button" class="btn-admin btn-admin-success" onclick="saveAllChanges()">
          <span>Save Changes</span>
        </button>
        <button type="button" class="btn-admin btn-admin-primary" onclick="exportJSON()">
          <span>Download JSON</span>
        </button>
      </div>
    </div>

    <!-- TAB 1: Profile & Bio -->
    <div class="admin-tab-section" id="profileSection">
      <div class="admin-card">
        <h2 class="admin-card-title">Profile Identity & Contact Info</h2>

        <div class="form-grid-3" style="margin-bottom: 1.25rem;">
          <div>
            <label class="form-label">Full Name</label>
            <input type="text" id="profileName" class="form-control">
          </div>
          <div>
            <label class="form-label">Primary Role</label>
            <input type="text" id="profileRolePrimary" class="form-control">
          </div>
          <div>
            <label class="form-label">Secondary Role</label>
            <input type="text" id="profileRoleSecondary" class="form-control">
          </div>
        </div>

        <div class="form-grid-3" style="margin-bottom: 1.25rem;">
          <div>
            <label class="form-label">Email Address</label>
            <input type="email" id="profileEmail" class="form-control">
          </div>
          <div>
            <label class="form-label">Phone / WhatsApp</label>
            <input type="text" id="profilePhone" class="form-control">
          </div>
          <div>
            <label class="form-label">Location</label>
            <input type="text" id="profileLocation" class="form-control">
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label class="form-label">Hero Headline</label>
          <input type="text" id="profileHeadline" class="form-control">
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label class="form-label">Hero Bio</label>
          <textarea id="profileBio" class="form-control" rows="3"></textarea>
        </div>
      </div>
    </div>

    <!-- TAB REST -->
    <div class="admin-tab-section" id="projectsSection" style="display: none;">
      <div class="admin-card"><div id="projectsContainer"></div></div>
    </div>
    <div class="admin-tab-section" id="experienceSection" style="display: none;">
      <div class="admin-card"><div id="experienceContainer"></div></div>
    </div>
    <div class="admin-tab-section" id="skillsSection" style="display: none;">
      <div class="admin-card"><div id="opsSkillsContainer"></div><div id="techSkillsContainer"></div></div>
    </div>
    <div class="admin-tab-section" id="achievementsSection" style="display: none;">
      <div class="admin-card"><div id="achievementsContainer"></div></div>
    </div>
    <div class="admin-tab-section" id="settingsSection" style="display: none;">
      <div class="admin-card">
        <label class="form-label">Custom Logo URL</label>
        <input type="text" id="settingLogoUrl" class="form-control">
        <label class="form-label" style="margin-top:1rem; display:block;">Custom Background URL</label>
        <input type="text" id="settingBackgroundUrl" class="form-control">
      </div>
    </div>

  </main>

  <!-- SCRIPT LOGIK LANGSUNG DI FILE INI (BEBAS LAG & CACHE ERROR) -->
  <script>
    function checkDirectAuth() {
      const isAuth = sessionStorage.getItem('admin_logged_in') === 'true';
      const overlay = document.getElementById('authOverlay');
      if (overlay) overlay.style.display = isAuth ? 'none' : 'flex';
    }

    function directLogin(e) {
      if (e) e.preventDefault();
      const u = document.getElementById('adminUser').value.trim();
      const p = document.getElementById('adminPass').value;

      if (u === 'admin' && p === 'admin123') {
        sessionStorage.setItem('admin_logged_in', 'true');
        checkDirectAuth();
      } else {
        document.getElementById('authError').textContent = 'Username atau password salah! Gunakan admin / admin123';
      }
    }

    function directLogout() {
      sessionStorage.removeItem('admin_logged_in');
      checkDirectAuth();
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkDirectAuth();
    });
  </script>
  <script src="../js/admin.js"></script>
</body>

</html>
